name: CI Quality & Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run ShellCheck
        run: nix develop --command shellcheck -s bash --source-path=scripts/deploy scripts/deploy/*.sh scripts/ops/*.sh

      - name: Run sqlc compile
        run: nix develop --command sqlc compile

      - name: Run Go Suite (Format, Vet, Tests)
        run: nix develop --command task go:check

      - name: Install Frontend Dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Run ESLint (Affected apps only)
        run: |
          FILTER="--filter=...[HEAD^]"
          git rev-parse HEAD^ >/dev/null 2>&1 || FILTER=""
          nix develop --command pnpm turbo run lint $FILTER

      - name: Run Frontend Tests (Affected apps only)
        run: |
          FILTER="--filter=...[HEAD^]"
          git rev-parse HEAD^ >/dev/null 2>&1 || FILTER=""
          nix develop --command pnpm turbo run test $FILTER

      - name: Run Frontend Build (Affected apps only)
        run: |
          FILTER="--filter=...[HEAD^]"
          git rev-parse HEAD^ >/dev/null 2>&1 || FILTER=""
          nix develop --command pnpm turbo run build $FILTER

  docker-validation:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Next.js Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/next-app.Dockerfile
          push: false
          build-args: |
            APP_DIR=apps/personal-website
            APP_NAME=personal-website

      - name: Test Build Go Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/go-service.Dockerfile
          push: false
          build-args: |
            SERVICE_DIR=services/auth-api