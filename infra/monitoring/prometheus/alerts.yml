groups:
  - name: swiss-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service target {{ $labels.instance }} is down"
          description: "Target {{ $labels.instance }} in job {{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"} < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host root disk space low (< 15% free)"
          description: "Root filesystem free space is below 15% (current: {{ $value | printf \"%.2f\" }}%)."

      - alert: HostMemoryLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host available memory low (< 10% free)"
          description: "Host available RAM is under 10% (current: {{ $value | printf \"%.2f\" }}%)."

      - alert: HighHttp5xxErrorRateAuth
        expr: (rate(swiss_auth_api_http_requests_total{status=~"5.."}[5m]) / rate(swiss_auth_api_http_requests_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on auth-api (> 5%)"
          description: "auth-api is returning more than 5% 5xx HTTP responses over a 5-minute window."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres active connection pool elevated (> 80)"
          description: "Postgres active connection count is {{ $value }}."
