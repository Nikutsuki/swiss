global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["swiss-node-exporter:9100"]

  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["swiss-nginx-exporter:9113"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["swiss-postgres-exporter:9187"]

  - job_name: "auth-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth-api:8080"]
